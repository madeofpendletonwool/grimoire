services:
  grimoire:
    build: .
    image: ghcr.io/madeofpendletonwool/grimoire:latest
    container_name: grimoire
    ports:
      - "${GRIMOIRE_PORT:-8080}:8080"
    volumes:
      # grimoire.db holds the rules index, saved chat history *and* accounts.
      # Keep this volume or every conversation and login is lost when the
      # container is recreated.
      - grimoire-data:/data
      # Local D&D books (markdown/text), extracted from your PDFs with
      # scripts/extract-dnd-pdfs.py. Mounted read-only at /books; indexed
      # alongside the SRD when DND_DOCS_DIR=/books. Gitignored — the books
      # are copyrighted and never leave this machine.
      - ${DND_BOOKS_DIR:-./dnd-books}:/books:ro
    environment:
      # Q&A chat targets z.ai's Anthropic-compatible endpoint by default.
      # Search works with no key; chat is enabled once ANTHROPIC_API_KEY is set
      # (via this compose env, an exported shell env, or a .env file).
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.z.ai/api/anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-glm-4.6}
      # Standby provider, used when the primary is out of quota, rate limited,
      # rejecting its key, or unreachable. Unset by default; the key alone is
      # enough (base URL defaults to Anthropic's, model to ANTHROPIC_MODEL).
      # Further rungs: ANTHROPIC_FALLBACK_2_*, _3_, ...
      ANTHROPIC_FALLBACK_BASE_URL: ${ANTHROPIC_FALLBACK_BASE_URL:-}
      ANTHROPIC_FALLBACK_API_KEY: ${ANTHROPIC_FALLBACK_API_KEY:-}
      ANTHROPIC_FALLBACK_MODEL: ${ANTHROPIC_FALLBACK_MODEL:-}
      GRIMOIRE_ADDR: ${GRIMOIRE_ADDR:-:8080}
      # Index + chat history + accounts, on the named volume mounted above.
      GRIMOIRE_DB: ${GRIMOIRE_DB:-/data/grimoire.db}
      # The first visit to an unclaimed install creates the keeper account;
      # creation is closed after that unless this is turned on.
      GRIMOIRE_SESSION_TTL: ${GRIMOIRE_SESSION_TTL:-720h}
      GRIMOIRE_OPEN_REGISTRATION: ${GRIMOIRE_OPEN_REGISTRATION:-false}
      # Local D&D books at the read-only mount above. Reindex after changing
      # the directory: docker compose run --rm grimoire index
      DND_DOCS_DIR: ${DND_DOCS_DIR:-/books}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  grimoire-data:
