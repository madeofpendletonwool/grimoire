services:
  grimoire:
    build: .
    image: ghcr.io/madeofpendletonwool/grimoire:latest
    container_name: grimoire
    ports:
      - "${GRIMOIRE_PORT:-8080}:8080"
    volumes:
      - grimoire-data:/data
    environment:
      # Q&A chat targets z.ai's Anthropic-compatible endpoint by default.
      # Search works with no key; chat is enabled once ANTHROPIC_API_KEY is set
      # (via this compose env, an exported shell env, or a .env file).
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.z.ai/api/anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-glm-4.6}
      GRIMOIRE_ADDR: ${GRIMOIRE_ADDR:-:8080}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  grimoire-data:
