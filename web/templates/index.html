<!DOCTYPE html>
<html lang="en" data-corpus="mtg">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="dark">
	<title>Grimoire</title>
	<link rel="stylesheet" href="/static/fonts.css">
	<link rel="stylesheet" href="/static/mana.css">
	<link rel="stylesheet" href="/static/keyrune.css">
	<link rel="stylesheet" href="/static/style.css">
	<link rel="stylesheet" href="/static/pixel.css">
	<link rel="stylesheet" href="/static/themes.css">
	<link rel="icon" type="image/png" href="/static/assets/favicon-32.png">
	<link rel="apple-touch-icon" href="/static/assets/icon-192.png">
	<link rel="manifest" href="/static/site.webmanifest">
</head>
<body>
	<!-- The chamber. Layers are built by js/scene.js from the chosen scene. -->
	<div class="scene" id="scene" aria-hidden="true"></div>

	<div class="app" id="app">

		<!-- ---------- Sidebar ---------- -->
		<aside class="rail" id="rail" aria-label="Conversations">
			<div class="rail-head">
				<span class="wordmark"><span data-ico="spellbook"></span> Grimoire</span>
				<button type="button" class="icon-btn rail-collapse" id="rail-collapse" aria-label="Hide sidebar" title="Hide sidebar" data-gi="collapse"></button>
			</div>

			<button type="button" class="new-chat" id="new-chat">
				<span data-ico="scroll"></span> New chat
			</button>

			<!-- A destination, not a foot utility — so it sits with New chat, between
			     two other 32px sprites rather than among the vector-icon rows below. -->
			<button type="button" class="rail-action rail-study" id="rail-study">
				<span data-ico="card"></span> Study
			</button>

			<!-- The D&D encounter builder: party + monsters + a live DMG difficulty
			     verdict, saved per user. A sibling destination to Study. -->
			<button type="button" class="rail-action rail-encounter" id="rail-encounter">
				<span data-ico="dice"></span> Encounter
			</button>

			<!-- The MTG deck builder: describe an idea, pick a commander, draft
		     the 99 with the model, iterate, analyze a pasted list. A sibling
		     destination to Study and Encounter. -->
		<button type="button" class="rail-action rail-deck" id="rail-deck">
			<span data-ico="chest"></span> Deck
		</button>

		<div class="corpus-picker" role="radiogroup" aria-label="Rules corpus">
				<button type="button" class="corpus-opt is-active" data-corpus="mtg" role="radio" aria-checked="true">
					<span data-ico="orbBlue"></span> Magic
				</button>
				<button type="button" class="corpus-opt" data-corpus="dnd" role="radio" aria-checked="false">
					<span data-ico="swords"></span> D&amp;D
				</button>
			</div>

			<nav class="history" id="history" aria-label="Chat history"></nav>

			<div class="rail-foot">
				<button type="button" class="rail-action" id="rail-search">
					<span data-gi="search"></span> Search rules
					<kbd id="palette-kbd">Ctrl K</kbd>
				</button>
				<button type="button" class="rail-action" id="rail-settings"
					aria-expanded="false" aria-controls="settings-popup">Settings</button>
				<button type="button" class="rail-action" id="rail-signout" hidden>
					<span data-gi="signout"></span> Sign out
					<span class="rail-user" id="rail-user"></span>
				</button>
				<p class="model-badge" id="model-badge"></p>
				<div class="settings-popup" id="settings-popup" role="dialog" aria-label="Settings" hidden></div>
			</div>
		</aside>

		<div class="rail-scrim" id="rail-scrim" hidden></div>

		<!-- ---------- Conversation ---------- -->
		<main class="main" id="main">
			<header class="topbar">
				<button type="button" class="icon-btn rail-open" id="rail-open" aria-label="Show sidebar" title="Show sidebar" data-gi="menu"></button>
				<h1 class="conv-title" id="conv-title">New chat</h1>
				<span class="corpus-chip" id="corpus-chip" title="This conversation's rule set"></span>
				<div class="mode-toggle" id="mode-toggle" hidden role="radiogroup" aria-label="Mode">
					<button type="button" class="mode-opt is-active" data-mode="ask" role="radio" aria-checked="true" title="Free Q&amp;A with the sage">
						<span data-gi="ask"></span> Ask
					</button>
					<button type="button" class="mode-opt" data-mode="resolve" role="radio" aria-checked="false" title="Walk a board + spell sequence step by step">
						<span data-gi="resolve"></span> Resolve
					</button>
				</div>
				<div class="topbar-actions">
					<button type="button" class="icon-btn" id="topbar-search" aria-label="Search rules and cards" title="Search rules and cards" data-gi="search"></button>
					<button type="button" class="icon-btn" id="topbar-rename" aria-label="Rename conversation" title="Rename conversation" data-gi="rename" hidden></button>
					<button type="button" class="icon-btn danger" id="topbar-delete" aria-label="Delete conversation" title="Delete conversation" data-gi="delete" hidden></button>
				</div>
			</header>

			<div class="transcript" id="transcript" tabindex="-1">
				<section class="welcome" id="welcome">
					<div class="welcome-sigil" data-ico="spellbook" data-ico-scale="3"></div>
					<h2 class="welcome-title">Grimoire</h2>
					<p class="welcome-sub" id="welcome-sub">Ask, and the tome shall answer.</p>
					<div class="suggestions" id="suggestions"></div>
				</section>
				<div class="messages" id="messages"></div>
			</div>

			<!-- ---------- Study surface ---------- -->
			<section class="study" id="study-view" hidden aria-label="Study">
				<header class="study-head">
					<h2 class="study-title" id="study-title">Study</h2>
					<div class="study-decks" id="study-decks" role="tablist" aria-label="Deck"></div>
					<p class="study-meta" id="study-meta"></p>
					<button type="button" class="icon-btn" id="study-close" aria-label="Leave study" title="Back to chat" data-gi="close"></button>
				</header>
				<div class="study-body" id="study-body"></div>
			</section>

			<!-- ---------- Encounter builder surface ---------- -->
			<section class="encounter" id="encounter-view" hidden aria-label="Encounter builder">
				<header class="study-head">
					<h2 class="study-title" id="encounter-title">Encounter</h2>
					<div class="enc-saved" id="enc-saved-wrap">
						<select id="enc-saved" aria-label="Saved encounters">
							<option value="">Saved encounters…</option>
						</select>
					</div>
					<p class="study-meta" id="encounter-meta"></p>
					<button type="button" class="icon-btn" id="encounter-close" aria-label="Leave the builder" title="Back to chat" data-gi="close"></button>
				</header>
				<div class="enc-body">
					<div class="enc-col">
						<div class="enc-panel">
							<h3 class="enc-heading">Party</h3>
							<div class="enc-party" id="enc-party"></div>
							<form class="enc-add-party" id="enc-add-party" autocomplete="off">
								<label class="enc-level-label" for="enc-level">Level</label>
								<input id="enc-level" class="enc-field" type="number" min="1" max="20" value="1" aria-label="Character level">
								<button type="submit" class="enc-btn">Add character</button>
							</form>
						</div>
						<div class="enc-panel">
							<h3 class="enc-heading">Bestiary</h3>
							<form class="enc-search" id="enc-search" autocomplete="off">
								<input id="enc-search-input" class="enc-field" type="search" placeholder="Search SRD monsters…"
									aria-label="Search monsters">
								<button type="submit" class="enc-btn" aria-label="Search">Find</button>
							</form>
							<div class="enc-results" id="enc-results" role="listbox" aria-label="Monster results"></div>
						</div>
					</div>
					<div class="enc-col">
						<div class="enc-panel">
							<h3 class="enc-heading">Monsters</h3>
							<div class="enc-roster" id="enc-roster"></div>
						</div>
						<div class="enc-panel enc-verdict-panel">
							<h3 class="enc-heading">Difficulty</h3>
							<div class="enc-verdict" id="enc-verdict">
								<span class="enc-band" id="enc-band">—</span>
								<span class="enc-xp" id="enc-xp"></span>
							</div>
							<div class="enc-meter" id="enc-meter" aria-hidden="true" hidden><span id="enc-meter-fill"></span></div>
							<div class="enc-thresholds" id="enc-thresholds"></div>
						</div>
						<div class="enc-panel enc-actions">
							<form class="enc-save" id="enc-save" autocomplete="off">
								<input id="enc-name" class="enc-field" type="text" placeholder="Encounter name" aria-label="Encounter name">
								<button type="submit" class="enc-btn">Save</button>
							</form>
							<div class="enc-action-row">
								<button type="button" class="enc-btn" id="enc-new">New</button>
								<button type="button" class="enc-btn danger" id="enc-delete" hidden>Delete</button>
								<button type="button" class="enc-btn ask" id="enc-ask">Ask the sage about this</button>
							</div>
						</div>
					</div>
				</div>
			</section>

			<!-- ---------- Deck builder surface ---------- -->
		<section class="deckbuilder" id="deck-view" hidden aria-label="Deck builder">
			<header class="study-head">
				<h2 class="study-title" id="deck-title">Deck</h2>
				<div class="deck-saved-wrap">
					<select id="deck-saved" aria-label="Saved decks">
						<option value="">Saved decks…</option>
					</select>
				</div>
				<p class="study-meta" id="deck-meta"></p>
				<button type="button" class="icon-btn" id="deck-close" aria-label="Leave the deck builder" title="Back to chat" data-gi="close"></button>
			</header>
			<div class="deck-body">
				<div class="deck-col deck-col-idea">
					<div class="deck-panel">
						<h3 class="deck-heading">The idea</h3>
						<form class="deck-idea-form" id="deck-idea-form" autocomplete="off">
							<textarea id="deck-idea" class="deck-idea-input" rows="3"
								placeholder="e.g. Kaalia, aggressive angels and dragons, mid budget"
								aria-label="Describe the deck you want"></textarea>
							<input id="deck-colors" class="deck-field deck-colors" type="text"
								placeholder="Colors (optional) — e.g. Mardu, BRW"
								aria-label="Color constraint">
							<button type="submit" class="deck-btn" id="deck-propose-btn">Find commanders</button>
						</form>
						<div class="deck-results" id="deck-commanders" role="listbox" aria-label="Commander proposals"></div>
					</div>
					<div class="deck-panel">
						<h3 class="deck-heading">Revise</h3>
						<form class="deck-idea-form" id="deck-feedback-form" autocomplete="off">
							<textarea id="deck-feedback" class="deck-idea-input" rows="2"
								placeholder="e.g. more interaction, cheaper curve, cut the salt"
								aria-label="Revision instruction"></textarea>
							<button type="submit" class="deck-btn" id="deck-revise-btn" disabled>Revise draft</button>
						</form>
					</div>
					<div class="deck-panel">
						<h3 class="deck-heading">Analyze a list</h3>
						<form class="deck-idea-form" id="deck-analyze-form" autocomplete="off">
							<textarea id="deck-analyze-input" class="deck-idea-input" rows="4"
								placeholder="Paste a decklist — one card per line&#10;2x Sol Ring&#10;36 Mountain"
								aria-label="Decklist to analyze"></textarea>
							<button type="submit" class="deck-btn">Analyze</button>
						</form>
					</div>
				</div>
				<div class="deck-col deck-col-draft">
					<div class="deck-panel deck-draft-panel">
						<h3 class="deck-heading">Draft</h3>
						<div class="deck-draft-status" id="deck-draft-status"></div>
						<div class="deck-commentary" id="deck-commentary" hidden></div>
						<div class="deck-list" id="deck-list"></div>
						<div class="deck-combos" id="deck-combos" hidden></div>
					</div>
					<div class="deck-panel deck-report-panel">
						<h3 class="deck-heading">Report</h3>
						<div class="deck-report" id="deck-report"></div>
						<div class="deck-curve" id="deck-curve" hidden></div>
					</div>
					<div class="deck-panel deck-actions">
						<form class="deck-save" id="deck-save" autocomplete="off">
							<input id="deck-name" class="deck-field" type="text" placeholder="Deck name" aria-label="Deck name">
							<button type="submit" class="deck-btn">Save</button>
						</form>
						<div class="deck-action-row">
							<button type="button" class="deck-btn" id="deck-copy">Copy list</button>
							<button type="button" class="deck-btn danger" id="deck-delete" hidden>Delete</button>
						</div>
					</div>
				</div>
			</div>
		</section>

		<div class="composer-dock">
				<form class="composer" id="composer" autocomplete="off">
					<textarea id="composer-input" class="composer-input" rows="1"
						placeholder="Ask the sage…  (/card, /rule, Ctrl+K to search)"
						aria-label="Ask a question"></textarea>
					<div class="composer-side">
						<button type="button" class="voice-btn" id="voice-btn" aria-label="Dictate" aria-pressed="false" title="Dictate" data-gi="mic" disabled></button>
						<button type="submit" class="send-btn" id="send-btn" aria-label="Send" title="Send" data-gi="send"></button>
						<button type="button" class="send-btn stop-btn" id="stop-btn" aria-label="Stop generating" title="Stop generating" data-gi="stop" hidden></button>
					</div>
					<ul class="slash-hints" id="slash-hints" role="listbox" aria-label="Commands" hidden></ul>
				</form>
				<form class="composer resolver" id="resolver" autocomplete="off" hidden>
					<div class="resolver-grid">
						<label class="resolver-field">
							<span class="resolver-label">Board</span>
							<textarea id="resolver-board" rows="3"
								placeholder="One permanent per line:&#10;You: Blood Artist&#10;Opp: Doomed Traveler  # tapped"
								aria-label="Board state"></textarea>
						</label>
						<label class="resolver-field">
							<span class="resolver-label">Sequence</span>
							<textarea id="resolver-sequence" rows="3"
								placeholder="One spell/ability per line, in order:&#10;1. Opp casts Wrath of God&#10;2. You respond with …"
								aria-label="Spell and ability sequence"></textarea>
						</label>
					</div>
					<label class="resolver-note-row">
						<span class="resolver-label">Note</span>
						<input id="resolver-note" type="text"
							placeholder="Whose turn, choices already made, anything else the resolver should know"
							aria-label="Clarifying note">
					</label>
					<div class="composer-side">
						<button type="submit" class="send-btn" id="resolve-btn" aria-label="Resolve" title="Resolve the sequence" data-gi="send"></button>
						<button type="button" class="send-btn stop-btn" id="resolve-stop" aria-label="Stop generating" title="Stop generating" data-gi="stop" hidden></button>
					</div>
				</form>
				<p class="composer-foot" id="composer-foot"></p>
				<p class="resolver-caveat" id="resolver-caveat" hidden>Assistant, not oracle — verify against the Comprehensive Rules.</p>
			</div>
		</main>

		<!-- ---------- Reference drawer ---------- -->
		<aside class="drawer" id="drawer" aria-label="Reference" hidden>
			<div class="drawer-head">
				<h2 class="drawer-title" id="drawer-title"></h2>
				<button type="button" class="icon-btn" id="drawer-close" aria-label="Close reference" data-gi="close"></button>
			</div>
			<div class="drawer-body" id="drawer-body"></div>
		</aside>
	</div>

	<!-- ---------- Command palette ---------- -->
	<div class="palette-layer" id="palette" hidden>
		<div class="palette-scrim" data-palette-close></div>
		<div class="palette-box" role="dialog" aria-modal="true" aria-label="Search rules and cards">
			<div class="palette-inputwrap">
				<span class="palette-icon" data-gi="search"></span>
				<input type="text" id="palette-input" class="palette-input"
					placeholder="Search rules, or a card name…"
					aria-label="Search rules and cards" aria-controls="palette-results" autocomplete="off">
				<kbd>Esc</kbd>
			</div>
			<div class="palette-results" id="palette-results" role="listbox" aria-label="Results"></div>
			<div class="palette-foot">
				<span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
				<span><kbd>↵</kbd> open</span>
				<span id="palette-scope"></span>
			</div>
		</div>
	</div>

	<script type="module" src="/static/js/app.js"></script>
</body>
</html>
