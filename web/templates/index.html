<!DOCTYPE html>
<html lang="en" data-corpus="mtg">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="dark">
	<title>Grimoire</title>
	<link rel="stylesheet" href="/static/style.css">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E">
</head>
<body>
	<div class="app" id="app">

		<!-- ---------- Sidebar ---------- -->
		<aside class="rail" id="rail" aria-label="Conversations">
			<div class="rail-head">
				<span class="wordmark"><span class="sigil">📜</span> Grimoire</span>
				<button type="button" class="icon-btn rail-collapse" id="rail-collapse" aria-label="Hide sidebar" title="Hide sidebar">‹</button>
			</div>

			<button type="button" class="new-chat" id="new-chat">
				<span class="plus" aria-hidden="true">✧</span> New chat
			</button>

			<div class="corpus-picker" role="radiogroup" aria-label="Rules corpus">
				<button type="button" class="corpus-opt is-active" data-corpus="mtg" role="radio" aria-checked="true">✦ Magic</button>
				<button type="button" class="corpus-opt" data-corpus="dnd" role="radio" aria-checked="false">⚔ D&amp;D</button>
			</div>

			<nav class="history" id="history" aria-label="Chat history"></nav>

			<div class="rail-foot">
				<button type="button" class="rail-action" id="rail-search">
					<span aria-hidden="true">🔎</span> Search rules
					<kbd id="palette-kbd">Ctrl K</kbd>
				</button>
				<button type="button" class="rail-action" id="rail-signout" hidden>
					<span aria-hidden="true">🕯</span> Sign out
					<span class="rail-user" id="rail-user"></span>
				</button>
				<p class="model-badge" id="model-badge"></p>
			</div>
		</aside>

		<div class="rail-scrim" id="rail-scrim" hidden></div>

		<!-- ---------- Conversation ---------- -->
		<main class="main">
			<header class="topbar">
				<button type="button" class="icon-btn rail-open" id="rail-open" aria-label="Show sidebar" title="Show sidebar">☰</button>
				<h1 class="conv-title" id="conv-title">New chat</h1>
				<span class="corpus-chip" id="corpus-chip" title="This conversation's rule set"></span>
				<div class="mode-toggle" id="mode-toggle" hidden role="radiogroup" aria-label="Mode">
					<button type="button" class="mode-opt is-active" data-mode="ask" role="radio" aria-checked="true" title="Free Q&amp;A with the sage">💬 Ask</button>
					<button type="button" class="mode-opt" data-mode="resolve" role="radio" aria-checked="false" title="Walk a board + spell sequence step by step">🔮 Resolve</button>
				</div>
				<div class="topbar-actions">
					<button type="button" class="icon-btn" id="topbar-search" aria-label="Search rules and cards" title="Search rules and cards">🔎</button>
					<button type="button" class="icon-btn" id="topbar-rename" aria-label="Rename conversation" title="Rename conversation" hidden>✎</button>
					<button type="button" class="icon-btn danger" id="topbar-delete" aria-label="Delete conversation" title="Delete conversation" hidden>🗑</button>
				</div>
			</header>

			<div class="transcript" id="transcript" tabindex="-1">
				<section class="welcome" id="welcome">
					<div class="welcome-sigil" aria-hidden="true">📜</div>
					<h2 class="welcome-title">Grimoire</h2>
					<p class="welcome-sub" id="welcome-sub">Ask, and the tome shall answer.</p>
					<div class="suggestions" id="suggestions"></div>
				</section>
				<div class="messages" id="messages"></div>
			</div>

			<div class="composer-dock">
				<form class="composer" id="composer" autocomplete="off">
					<textarea id="composer-input" class="composer-input" rows="1"
						placeholder="Ask the sage…  (/card, /rule, Ctrl+K to search)"
						aria-label="Ask a question"></textarea>
					<div class="composer-side">
						<button type="submit" class="send-btn" id="send-btn" aria-label="Send" title="Send">➤</button>
						<button type="button" class="send-btn stop-btn" id="stop-btn" aria-label="Stop generating" title="Stop generating" hidden>■</button>
					</div>
					<ul class="slash-hints" id="slash-hints" role="listbox" aria-label="Commands" hidden></ul>
				</form>
				<form class="composer resolver" id="resolver" autocomplete="off" hidden>
					<div class="resolver-grid">
						<label class="resolver-field">
							<span class="resolver-label">Board</span>
							<textarea id="resolver-board" rows="3"
								placeholder="One permanent per line:&#10;You: Blood Artist&#10;Opp: Doomed Traveler  # tapped"
								aria-label="Board state"></textarea>
						</label>
						<label class="resolver-field">
							<span class="resolver-label">Sequence</span>
							<textarea id="resolver-sequence" rows="3"
								placeholder="One spell/ability per line, in order:&#10;1. Opp casts Wrath of God&#10;2. You respond with …"
								aria-label="Spell and ability sequence"></textarea>
						</label>
					</div>
					<label class="resolver-note-row">
						<span class="resolver-label">Note</span>
						<input id="resolver-note" type="text"
							placeholder="Whose turn, choices already made, anything else the resolver should know"
							aria-label="Clarifying note">
					</label>
					<div class="composer-side">
						<button type="submit" class="send-btn" id="resolve-btn" aria-label="Resolve" title="Resolve the sequence">➤</button>
						<button type="button" class="send-btn stop-btn" id="resolve-stop" aria-label="Stop generating" title="Stop generating" hidden>■</button>
					</div>
				</form>
				<p class="composer-foot" id="composer-foot"></p>
				<p class="resolver-caveat" id="resolver-caveat" hidden>Assistant, not oracle — verify against the Comprehensive Rules.</p>
			</div>
		</main>

		<!-- ---------- Reference drawer ---------- -->
		<aside class="drawer" id="drawer" aria-label="Reference" hidden>
			<div class="drawer-head">
				<h2 class="drawer-title" id="drawer-title"></h2>
				<button type="button" class="icon-btn" id="drawer-close" aria-label="Close reference">✕</button>
			</div>
			<div class="drawer-body" id="drawer-body"></div>
		</aside>
	</div>

	<!-- ---------- Command palette ---------- -->
	<div class="palette-layer" id="palette" hidden>
		<div class="palette-scrim" data-palette-close></div>
		<div class="palette-box" role="dialog" aria-modal="true" aria-label="Search rules and cards">
			<div class="palette-inputwrap">
				<span class="palette-icon" aria-hidden="true">🔎</span>
				<input type="text" id="palette-input" class="palette-input"
					placeholder="Search rules, or a card name…"
					aria-label="Search rules and cards" aria-controls="palette-results" autocomplete="off">
				<kbd>Esc</kbd>
			</div>
			<div class="palette-results" id="palette-results" role="listbox" aria-label="Results"></div>
			<div class="palette-foot">
				<span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
				<span><kbd>↵</kbd> open</span>
				<span id="palette-scope"></span>
			</div>
		</div>
	</div>

	<script type="module" src="/static/js/app.js"></script>
</body>
</html>
